name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

      - name: Diagnose review service failure
        if: failure() && steps.claude-review.outcome == 'failure'
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          path = pathlib.Path(os.environ.get("CLAUDE_EXECUTION_FILE") or
                              pathlib.Path(os.environ["RUNNER_TEMP"]) / "claude-execution-output.json")
          if not path.is_file():
              print("::error::Claude review failed before producing an execution result.")
              raise SystemExit(0)
          messages = json.loads(path.read_text())
          if isinstance(messages, dict):
              messages = [messages]
          output = "\n".join(str(message.get("result", "")) + " " +
                             json.dumps(message.get("errors", []))
                             for message in messages if message.get("type") == "result")
          # Report only recognized error categories, never the transcript or credentials.
          categories = {
              "expired authentication": r"token.{0,80}expired|expired.{0,80}token",
              "authentication rejected": r"authentication_error|unauthorized|invalid.{0,20}(api.key|token)|not logged in|please run /login",
              "HTTP 401": r"\b401\b",
              "HTTP 403": r"\b403\b",
              "rate limit": r"rate_limit_error|rate limit|usage limit|limit reached",
              "insufficient credits": r"credit balance|insufficient.quota",
              "model unavailable": r"model_not_found|model.{0,80}(not found|does not exist|not available)",
          }
          detected = [name for name, pattern in categories.items()
                      if re.search(pattern, output, re.IGNORECASE)]
          print("::error::Claude review service failure: " +
                (", ".join(detected) or "unclassified execution error"))
          PY

