[package]
name = "meteogram-native"
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
publish = false

[dependencies]
anyhow = "1"
blusc = "=0.0.6"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
fs2 = "0.4"
futures = "0.3"
gribberish = "=1.8.4"
icechunk = { version = "=2.3.0", default-features = false, features = ["object-store-http", "object-store-s3", "object-store-gcs"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
